<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to-do-app</title>
    <link rel="stylesheet" href="css/base.css" />  
    <link rel="stylesheet" href="css/header.css" />      
    <link rel="stylesheet" href="css/input-form.css" />         
    <link rel="stylesheet" href="css/task-list.css" /> 
</head>
<body>
    
    

        <!--
    ┌─────────────────────────────────────────────┐
    │  LAYOUT WRAPPER                             │
    │  Centers everything on the page             │
    └─────────────────────────────────────────────┘
  -->
  <div class="app-wrapper"> 

    <!-- MODULE 1 : Header -->
    <header class="app-header">
      <div class="header-brand">
        <span class="brand-icon">✦</span>
        <h1 class="brand-title">TaskFlow</h1>
      </div>
      <p class="header-subtitle">Stay on top of everything.</p>
      <!-- Live counter injected by render.js -->
      <div class="task-counter" id="taskCounter">0 tasks remaining</div>
    </header>

    <!-- MODULE 2 : Add-Task Form -->
    <section class="input-section" aria-label="Add a new task">
      <div class="input-card">
        <input
          type="text"
          id="taskInput"
          class="task-input"
          placeholder="What needs to be done?"
          maxlength="120"
          autocomplete="off"
        />
        <button class="btn-add" id="addBtn" aria-label="Add task">
          <span class="btn-icon">+</span>
          <span class="btn-label">Add</span>
        </button>
      </div>
      <!-- Inline error shown by events.js when input is empty -->
      <p class="input-error hidden" id="inputError">Please enter a task first!</p>
    </section>

<!-- MODULE 3: Task List (cards injected here by render.js) -->
    <main class="task-list" id="taskList" aria-live="polite">
      <!-- Task cards are generated dynamically – see js/render.js -->
    </main>

    <!-- MODULE 4 : Empty-state message (hidden when tasks exist) -->
    <div class="empty-state hidden" id="emptyState">
      <span class="empty-icon">📋</span>
      <p>No tasks yet. Add one above!</p>
    </div>

    <!-- MODULE 5 : Filter Tabs -->
    <nav class="filter-bar" aria-label="Filter tasks">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </nav>

    <!-- MODULE 6 : Footer action -->
    <footer class="app-footer">
      <button class="btn-clear-done" id="clearDoneBtn">
        Clear completed tasks
      </button>
    </footer>

  </div><!-- /.app-wrapper -->

<!-- ── JAVASCRIPT (load order matters!) ──────────────────────── -->
  <script src="js/storage.js"></script>   <!-- 1. read/write localStorage  -->
  <script src="js/render.js"></script>    <!-- 2. build HTML from data      -->
  <script src="js/events.js"></script>    <!-- 3. attach click/key handlers -->
  <script src="js/app.js"></script>       <!-- 4. boot the app              -->

  </div>
</body>
</html>
